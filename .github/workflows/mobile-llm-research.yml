name: ModelOrbit free remote mobile LLM research

on:
  schedule:
    # Mondays at 09:00 Asia/Kolkata (03:30 UTC). GitHub may delay scheduled runs.
    - cron: "30 3 * * 1"
  workflow_dispatch:

concurrency:
  group: modelorbit-mobile-llm-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out ModelOrbit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect public research evidence
        run: npm run research:remote:collect

      - name: Validate collected evidence and repository
        run: |
          npm run research:remote:validate
          npm test
          npm run validate
          npm run research:validate
          npm run research:preflight
          npm run research:poc-status
          npm run normalize
          git diff --check

      - name: Commit and push validated refresh
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No research changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github data/research/remote docs/handoff.md README.md package.json spec test tools/ingest
          git diff --cached --check
          git commit -m "chore: refresh mobile LLM research"
          git push origin HEAD:main
